name: Release

# On every push to main, release-please keeps a "Release x.y.z" pull request up to date,
# with the version (from Conventional Commit messages) and CHANGELOG.md. Merging that
# PR tags the release; this workflow then builds the package, attaches it to the GitHub
# release, and waits for approval (the kde-store environment) before uploading it to
# the KDE Store. Everything runs in this one workflow because releases created with
# GITHUB_TOKEN don't trigger other workflows.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install PySide6-Essentials==6.8.1
          python -m unittest discover -s tests -v
      - name: Build .kwinscript
        run: make package
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.kwinscript --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kwinscript
          path: dist/*.kwinscript

  publish-kde-store:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    # Approval gate: configure required reviewers on this environment
    # (Settings → Environments → kde-store). Its secrets are only readable once approved.
    environment:
      name: kde-store
      url: https://store.kde.org/p/${{ vars.KDE_STORE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: kwinscript
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install niquests==3.21.2
      - name: Upload to the KDE Store
        env:
          PLING_PROJECT_ID: ${{ vars.KDE_STORE_PROJECT_ID }}
          PLING_USERNAME: ${{ secrets.PLING_USERNAME }}
          PLING_PASSWORD: ${{ secrets.PLING_PASSWORD }}
        run: python scripts/pling_upload.py --file dist/*.kwinscript --changelog CHANGELOG.md
