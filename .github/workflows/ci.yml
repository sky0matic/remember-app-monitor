name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6 (Qt's JavaScript engine for the logic tests)
        run: pip install PySide6-Essentials==6.8.1
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .kwinscript
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: kwinscript
          path: dist/*.kwinscript
